version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: clank
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

brews:
  - repository:
      owner: voska
      name: homebrew-tap
    homepage: https://github.com/voska/clank
    description: "tmux sidebar for AI agent fleet visibility"
    license: MIT
    install: |
      bin.install "clank"
    test: |
      system "#{bin}/clank", "--version"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
